<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thot Bubbles Ma(gay)zine</title>
  <link rel="icon" href="assets/images/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #111; }

    .spread {
      position: fixed;
      inset: 0;
      display: flex;
      perspective: 4000px;
    }
    .page-slot {
      flex: 1;
      height: 100%;
      overflow: hidden;
      background: #111;
      position: relative;
    }
    .page-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .page-slot:first-child img { object-position: right center; }
    .page-slot:last-child  img { object-position: left center; }

    /* Top nav */
    .nav-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: linear-gradient(to bottom, rgba(17,17,17,0.92) 0%, transparent 100%);
      pointer-events: none;
    }
    .nav-top > * { pointer-events: auto; }
    .nav-top__back {
      font-family: 'Oswald', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-top__back:hover { color: #e4028c; }
    .nav-top__title {
      font-family: 'Oswald', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
    }
    .nav-top__counter {
      font-family: 'Oswald', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.38);
    }

    /* Arrows */
    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 200;
      background: #e4028c;
      color: #fff;
      border: none;
      width: 38px; height: 62px;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      transition: background 0.15s, transform 0.15s, opacity 0.2s;
    }
    .arrow:hover { background: #fff; color: #111; transform: translateY(-50%) scale(1.06); }
    .arrow:disabled { opacity: 0; pointer-events: none; }
    .arrow--prev { left: 6px; }
    .arrow--next { right: 6px; }

    /* Mobile: single page */
    @media (max-width: 700px) {
      .page-slot:last-child { display: none; }
      .page-slot:first-child { flex: 2; }
      .arrow { width: 32px; height: 52px; font-size: 0.95rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

<div class="spread" id="spread">
  <div class="page-slot" id="slotL"><img id="imgL" alt="" /></div>
  <div class="page-slot" id="slotR"><img id="imgR" alt="" /></div>
</div>

<div class="nav-top">
  <a class="nav-top__back" href="flipbook.html?page=carousel">← Portfolio</a>
  <span class="nav-top__title">Thot Bubbles Ma(gay)zine</span>
  <span class="nav-top__counter" id="counter"></span>
</div>

<button class="arrow arrow--prev" id="prev">&#8592;</button>
<button class="arrow arrow--next" id="next">&#8594;</button>

<script>
  const TOTAL = 62;
  const PAGES = Array.from({length: TOTAL}, (_, i) =>
    `assets/images/magazine/page-${String(i+1).padStart(2,'0')}.jpg`
  );
  // 31 spreads: [0,1],[2,3],...[60,61]
  const SPREADS = Array.from({length: 31}, (_, i) => [i*2, i*2+1]);

  const TURN_MS = 380;
  let cur    = 0;
  let curMob = 0;
  let turning = false;

  const spreadEl = document.getElementById('spread');
  const imgL  = document.getElementById('imgL');
  const imgR  = document.getElementById('imgR');
  const prev  = document.getElementById('prev');
  const next  = document.getElementById('next');
  const ctr   = document.getElementById('counter');

  function isMobile() { return window.innerWidth <= 700; }

  function render() {
    if (isMobile()) {
      imgL.src = PAGES[curMob];
      ctr.textContent = `${curMob+1} / ${TOTAL}`;
      prev.disabled = curMob === 0 || turning;
      next.disabled = curMob === TOTAL-1 || turning;
    } else {
      const [l,r] = SPREADS[cur];
      imgL.src = PAGES[l];
      imgR.src = r < TOTAL ? PAGES[r] : '';
      ctr.textContent = r < TOTAL ? `${l+1}–${r+1} / ${TOTAL}` : `${l+1} / ${TOTAL}`;
      prev.disabled = cur === 0 || turning;
      next.disabled = cur === SPREADS.length-1 || turning;
    }
    preload();
  }

  function preload() {
    if (isMobile()) {
      [curMob-1,curMob+1].forEach(i => { if(i>=0&&i<TOTAL) new Image().src=PAGES[i]; });
    } else {
      [cur-1,cur+1].forEach(si => {
        if(si>=0&&si<SPREADS.length) SPREADS[si].forEach(pi => { if(pi<TOTAL) new Image().src=PAGES[pi]; });
      });
    }
  }

  function goNext() {
    if (turning) return;
    if (isMobile()) {
      if (curMob >= TOTAL-1) return;
      fade(curMob+1);
    } else {
      if (cur >= SPREADS.length-1) return;
      turning = true; prev.disabled=true; next.disabled=true;
      turnForward(cur+1);
    }
  }

  function goPrev() {
    if (turning) return;
    if (isMobile()) {
      if (curMob <= 0) return;
      fade(curMob-1);
    } else {
      if (cur <= 0) return;
      turning = true; prev.disabled=true; next.disabled=true;
      turnBackward(cur-1);
    }
  }

  function fade(n) {
    turning = true;
    imgL.style.transition = 'opacity 0.18s';
    imgL.style.opacity = '0';
    setTimeout(() => {
      curMob = n; render();
      imgL.style.opacity = '1';
      setTimeout(() => { imgL.style.transition=''; turning=false; }, 180);
    }, 180);
  }

  function turnForward(ni) {
    const [,curR] = SPREADS[cur];
    const [nL,nR] = SPREADS[ni];
    if (nR < TOTAL) imgR.src = PAGES[nR];
    const leaf = makeLeaf(PAGES[curR], PAGES[nL], true);
    spreadEl.appendChild(leaf);
    requestAnimationFrame(() => requestAnimationFrame(() => { leaf.style.transform='rotateY(-180deg)'; }));
    leaf.addEventListener('transitionend', () => {
      spreadEl.removeChild(leaf);
      imgL.src = PAGES[nL];
      cur = ni; turning = false; render();
    }, {once:true});
  }

  function turnBackward(pi) {
    const [curL] = SPREADS[cur];
    const [pL,pR] = SPREADS[pi];
    imgL.src = PAGES[pL];
    const leaf = makeLeaf(PAGES[curL], pR<TOTAL?PAGES[pR]:null, false);
    spreadEl.appendChild(leaf);
    requestAnimationFrame(() => requestAnimationFrame(() => { leaf.style.transform='rotateY(180deg)'; }));
    leaf.addEventListener('transitionend', () => {
      spreadEl.removeChild(leaf);
      imgR.src = pR<TOTAL ? PAGES[pR] : '';
      cur = pi; turning = false; render();
    }, {once:true});
  }

  function makeLeaf(front, back, fwd) {
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;top:0;left:${fwd?'50%':'0'};width:50%;height:100%;
      transform-style:preserve-3d;transform-origin:${fwd?'left':'right'} center;
      transform:rotateY(0deg);transition:transform ${TURN_MS}ms cubic-bezier(.645,.045,.355,1);
      z-index:50;pointer-events:none;`;
    d.appendChild(face(front,false,fwd));
    d.appendChild(face(back,true,fwd));
    return d;
  }

  function face(src, back, fwd) {
    const f = document.createElement('div');
    f.style.cssText = `position:absolute;inset:0;background:#111;overflow:hidden;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;
      ${back?'transform:rotateY(180deg);':''}`;
    if (src) {
      const i = document.createElement('img');
      i.src=src; i.style.cssText='width:100%;height:100%;object-fit:contain;display:block;';
      f.appendChild(i);
    }
    const g = !back
      ? (fwd?'linear-gradient(to left,rgba(0,0,0,.25) 0%,transparent 40%)':'linear-gradient(to right,rgba(0,0,0,.25) 0%,transparent 40%)')
      : (fwd?'linear-gradient(to right,rgba(0,0,0,.32) 0%,transparent 40%)':'linear-gradient(to left,rgba(0,0,0,.32) 0%,transparent 40%)');
    const s = document.createElement('div');
    s.style.cssText=`position:absolute;inset:0;background:${g};pointer-events:none;`;
    f.appendChild(s);
    return f;
  }

  prev.addEventListener('click', goPrev);
  next.addEventListener('click', goNext);
  document.addEventListener('keydown', e => {
    if (e.key==='ArrowLeft') goPrev();
    if (e.key==='ArrowRight') goNext();
  });
  let tx=null;
  document.addEventListener('touchstart', e=>{tx=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend', e=>{
    if(tx===null)return;
    const dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>45) dx<0?goNext():goPrev();
    tx=null;
  },{passive:true});
  window.addEventListener('resize', render);

  render();
</script>
</body>
</html>
