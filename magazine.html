<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thot Bubbles Ma(gay)zine — Read Online</title>
  <link rel="icon" href="assets/images/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #1a1718;
      color: #fff;
      font-family: 'Jost', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      background: #111;
      border-bottom: 2px solid #ffd400;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .topbar__brand {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffd400;
      white-space: nowrap;
    }
    .topbar__brand span {
      color: #e4028c;
    }
    .topbar__back {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #aaa;
      text-decoration: none;
      transition: color 0.15s;
    }
    .topbar__back:hover { color: #ffd400; }
    .topbar__counter {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.78rem;
      color: #888;
      white-space: nowrap;
    }

    /* ── Viewer area ── */
    .viewer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 16px 70px;
    }

    /* ── Spread (two pages side by side) ── */
    .spread {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      height: 100%;
      max-height: 100%;
    }
    .spread__page {
      position: relative;
      display: none;
      height: 100%;
    }
    .spread__page.active {
      display: flex;
      align-items: center;
    }
    .spread__page img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }
    /* seam shadow between pages */
    .spread__page:first-child img {
      box-shadow: -2px 0 0 #111, 0 8px 40px rgba(0,0,0,0.7);
    }
    .spread__page:last-child img {
      box-shadow: 2px 0 0 #111, 0 8px 40px rgba(0,0,0,0.7);
    }

    /* ── Nav arrows ── */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,212,0,0.9);
      color: #111;
      border: none;
      width: 48px;
      height: 64px;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s, transform 0.15s;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover { background: #ffd400; transform: translateY(-50%) scale(1.05); }
    .nav-btn:active { transform: translateY(-50%) scale(0.97); }
    .nav-btn:disabled { opacity: 0.2; cursor: default; }
    .nav-btn--prev { left: 12px; }
    .nav-btn--next { right: 12px; }

    /* ── Bottom strip ── */
    .strip-wrap {
      background: #111;
      border-top: 2px solid #333;
      padding: 8px 16px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: #ffd400 #222;
    }
    .strip::-webkit-scrollbar { height: 4px; }
    .strip::-webkit-scrollbar-thumb { background: #ffd400; border-radius: 2px; }
    .strip__thumb {
      flex-shrink: 0;
      width: 44px;
      height: 60px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 3px;
      overflow: hidden;
      opacity: 0.5;
      transition: opacity 0.15s, border-color 0.15s;
    }
    .strip__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .strip__thumb:hover { opacity: 0.85; }
    .strip__thumb.active {
      border-color: #ffd400;
      opacity: 1;
    }

    /* ── Mobile: single page ── */
    @media (max-width: 600px) {
      .viewer { padding: 12px 52px; }
      .spread { gap: 0; }
      .spread__page.active.hide-mobile { display: none; }
      .nav-btn { width: 38px; height: 52px; font-size: 1.1rem; }
      .nav-btn--prev { left: 4px; }
      .nav-btn--next { right: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="topbar__back" href="index.html">← Back</a>
    <div class="topbar__brand">Thot Bubbles <span>Ma(gay)zine</span></div>
    <div class="topbar__counter" id="counter">Page 1 of 66</div>
  </div>

  <div class="viewer">
    <button class="nav-btn nav-btn--prev" id="prevBtn" aria-label="Previous page">&#8592;</button>

    <div class="spread" id="spread">
      <div class="spread__page" id="pageLeft">
        <img id="imgLeft" src="" alt="Left page" />
      </div>
      <div class="spread__page" id="pageRight">
        <img id="imgRight" src="" alt="Right page" />
      </div>
    </div>

    <button class="nav-btn nav-btn--next" id="nextBtn" aria-label="Next page">&#8594;</button>
  </div>

  <div class="strip-wrap">
    <div class="strip" id="strip"></div>
  </div>

  <script>
    // All pages in reading order
    const pages = [
      'assets/images/magazine/cover-1.jpg',
      'assets/images/magazine/cover-2.jpg',
      'assets/images/magazine/cover-3.jpg',
      'assets/images/magazine/cover-4.jpg',
      'assets/images/magazine/cover-5.jpg',
      'assets/images/magazine/cover-6.jpg',
      ...Array.from({length: 60}, (_, i) => {
        const n = String(i + 1).padStart(2, '0');
        return `assets/images/magazine/page-${n}.jpg`;
      })
    ];

    const total = pages.length;
    let current = 0; // index of left-page in spread (even = left, odd = right only)
    let twoUp = window.innerWidth > 600;

    const imgLeft  = document.getElementById('imgLeft');
    const imgRight = document.getElementById('imgRight');
    const pageLeft  = document.getElementById('pageLeft');
    const pageRight = document.getElementById('pageRight');
    const prevBtn  = document.getElementById('prevBtn');
    const nextBtn  = document.getElementById('nextBtn');
    const counter  = document.getElementById('counter');
    const strip    = document.getElementById('strip');

    // Build thumbnail strip
    pages.forEach((src, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'strip__thumb';
      thumb.innerHTML = `<img src="${src}" alt="Page ${i+1}" loading="lazy" />`;
      thumb.addEventListener('click', () => goTo(i));
      strip.appendChild(thumb);
    });

    function goTo(idx) {
      if (idx < 0) idx = 0;
      if (idx >= total) idx = total - 1;

      // Snap to even index for two-up (always show pairs)
      if (twoUp && idx % 2 !== 0) idx = idx - 1;

      current = idx;
      render();
    }

    function render() {
      twoUp = window.innerWidth > 600;

      const l = current;
      const r = current + 1;

      // Left page
      imgLeft.src = pages[l] || '';
      pageLeft.classList.toggle('active', true);

      // Right page — only in two-up and if page exists
      if (twoUp && r < total) {
        imgRight.src = pages[r] || '';
        pageRight.classList.toggle('active', true);
      } else {
        pageRight.classList.remove('active');
      }

      // Counter
      if (twoUp && r < total) {
        counter.textContent = `Pages ${l + 1}–${r + 1} of ${total}`;
      } else {
        counter.textContent = `Page ${l + 1} of ${total}`;
      }

      // Buttons
      prevBtn.disabled = current === 0;
      nextBtn.disabled = twoUp ? (current + 2 >= total) : (current + 1 >= total);

      // Strip highlight + scroll into view
      const thumbs = strip.querySelectorAll('.strip__thumb');
      thumbs.forEach((t, i) => {
        const isActive = twoUp ? (i === l || i === r) : i === l;
        t.classList.toggle('active', isActive);
      });
      if (thumbs[l]) {
        thumbs[l].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    prevBtn.addEventListener('click', () => {
      goTo(current - (twoUp ? 2 : 1));
    });
    nextBtn.addEventListener('click', () => {
      goTo(current + (twoUp ? 2 : 1));
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(current - (twoUp ? 2 : 1));
      if (e.key === 'ArrowRight') goTo(current + (twoUp ? 2 : 1));
    });

    // Resize handler
    window.addEventListener('resize', () => { twoUp = window.innerWidth > 600; render(); });

    // Init
    goTo(0);
  </script>

</body>
</html>
