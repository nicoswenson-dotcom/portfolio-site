<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Flipbook — Nico Swenson</title>
  <link rel="icon" href="assets/images/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: #1a1718;
      display: flex;
      flex-direction: column;
      font-family: 'Jost', sans-serif;
    }

    /* ── Top bar ── */
    .topbar {
      background: #111;
      border-bottom: 3px solid #ffd400;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }
    .topbar__logo { height: 34px; width: auto; }
    .topbar__title {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #ffd400;
    }
    .topbar__counter {
      font-family: 'Oswald', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: #888;
    }

    /* ── Flipbook viewport ── */
    .flipbook-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pages {
      display: flex;
      height: 100%;
      width: 100%;
      transition: transform 0.42s cubic-bezier(.6,0,.2,1);
    }

    .page {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1718;
      padding: 12px 60px;
    }

    .page img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      display: block;
    }

    /* ── Arrows ── */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      background: #ffd400;
      color: #111;
      border: none;
      width: 40px; height: 68px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.4);
      transition: background 0.15s, transform 0.15s;
    }
    .arrow:hover { background: #fff; transform: translateY(-50%) scale(1.06); }
    .arrow:disabled { opacity: 0.15; cursor: default; pointer-events: none; }
    .arrow--prev { left: 8px; }
    .arrow--next { right: 8px; }

    /* ── Bottom nav tabs ── */
    .bottom-nav {
      background: #111;
      border-top: 3px solid #ffd400;
      display: flex;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .bottom-nav::-webkit-scrollbar { display: none; }
    .nav-tab {
      flex: 1;
      min-width: 60px;
      padding: 10px 6px;
      background: none;
      border: none;
      border-right: 1px solid #2e2c2d;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 0.55rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .nav-tab:last-child { border-right: none; }
    .nav-tab:hover { color: #ffd400; background: #222; }
    .nav-tab.active { color: #ffd400; background: #1e1c1d; border-bottom: 3px solid #ffd400; }

    /* ── Thumbnail strip ── */
    .strip-wrap {
      background: #0d0d0d;
      border-top: 1px solid #333;
      padding: 6px 12px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 3px;
      scrollbar-width: thin;
      scrollbar-color: #ffd400 #222;
    }
    .strip::-webkit-scrollbar { height: 3px; }
    .strip::-webkit-scrollbar-thumb { background: #ffd400; border-radius: 2px; }
    .strip__thumb {
      flex-shrink: 0;
      width: 40px;
      height: 54px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 3px;
      overflow: hidden;
      opacity: 0.45;
      transition: opacity 0.15s, border-color 0.15s;
    }
    .strip__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .strip__thumb:hover { opacity: 0.8; }
    .strip__thumb.active { border-color: #ffd400; opacity: 1; }

    @media (max-width: 600px) {
      .page { padding: 8px 44px; }
      .arrow { width: 32px; height: 52px; font-size: 1rem; }
      .arrow--prev { left: 4px; }
      .arrow--next { right: 4px; }
      .strip-wrap { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pages { transition: none; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <img class="topbar__logo" src="assets/images/logo.png" alt="Nico Swenson" />
    <span class="topbar__title">Portfolio Flipbook</span>
    <span class="topbar__counter" id="counter">1 / 16</span>
  </header>

  <div class="flipbook-wrap">
    <button class="arrow arrow--prev" id="prev">&#8592;</button>
    <button class="arrow arrow--next" id="next">&#8594;</button>

    <div class="pages" id="pages">
      <div class="page"><img src="assets/images/flipbook-pages/page-01.jpg" alt="Page 1" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-02.jpg" alt="Page 2" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-03.jpg" alt="Page 3" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-04.jpg" alt="Page 4" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-05.jpg" alt="Page 5" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-06.jpg" alt="Page 6" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-07.jpg" alt="Page 7" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-08.jpg" alt="Page 8" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-09.jpg" alt="Page 9" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-10.jpg" alt="Page 10" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-11.jpg" alt="Page 11" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-12.jpg" alt="Page 12" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-13.jpg" alt="Page 13" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-14.jpg" alt="Page 14" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-15.jpg" alt="Page 15" /></div>
      <div class="page"><img src="assets/images/flipbook-pages/page-16.jpg" alt="Page 16" /></div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab active" data-page="0">Cover</button>
    <button class="nav-tab" data-page="1">2</button>
    <button class="nav-tab" data-page="2">3</button>
    <button class="nav-tab" data-page="3">4</button>
    <button class="nav-tab" data-page="4">5</button>
    <button class="nav-tab" data-page="5">6</button>
    <button class="nav-tab" data-page="6">7</button>
    <button class="nav-tab" data-page="7">8</button>
    <button class="nav-tab" data-page="8">9</button>
    <button class="nav-tab" data-page="9">10</button>
    <button class="nav-tab" data-page="10">11</button>
    <button class="nav-tab" data-page="11">12</button>
    <button class="nav-tab" data-page="12">13</button>
    <button class="nav-tab" data-page="13">14</button>
    <button class="nav-tab" data-page="14">15</button>
    <button class="nav-tab" data-page="15">16</button>
  </nav>

  <div class="strip-wrap">
    <div class="strip" id="strip"></div>
  </div>

  <script>
    const pagesEl = document.getElementById('pages');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const counter = document.getElementById('counter');
    const tabs    = document.querySelectorAll('.nav-tab');
    const strip   = document.getElementById('strip');
    const total   = 16;
    let cur = 0;

    // Build thumbnail strip
    for (let i = 1; i <= total; i++) {
      const n = String(i).padStart(2, '0');
      const thumb = document.createElement('div');
      thumb.className = 'strip__thumb' + (i === 1 ? ' active' : '');
      thumb.innerHTML = `<img src="assets/images/flipbook-pages/page-${n}.jpg" alt="Page ${i}" loading="lazy" />`;
      thumb.addEventListener('click', () => goTo(i - 1));
      strip.appendChild(thumb);
    }

    function goTo(idx) {
      if (idx < 0 || idx >= total) return;
      cur = idx;
      pagesEl.style.transform = `translateX(-${cur * 100}%)`;
      counter.textContent = `${cur + 1} / ${total}`;
      prevBtn.disabled = cur === 0;
      nextBtn.disabled = cur === total - 1;
      tabs.forEach((t, i) => t.classList.toggle('active', i === cur));
      tabs[cur]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      const thumbs = strip.querySelectorAll('.strip__thumb');
      thumbs.forEach((t, i) => t.classList.toggle('active', i === cur));
      thumbs[cur]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    prevBtn.addEventListener('click', () => goTo(cur - 1));
    nextBtn.addEventListener('click', () => goTo(cur + 1));
    tabs.forEach(t => t.addEventListener('click', () => goTo(+t.dataset.page)));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(cur - 1);
      if (e.key === 'ArrowRight') goTo(cur + 1);
    });

    let tx = null;
    pagesEl.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    pagesEl.addEventListener('touchend', e => {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 40) goTo(cur + (dx < 0 ? 1 : -1));
      tx = null;
    }, { passive: true });

    goTo(0);
  </script>

</body>
</html>
