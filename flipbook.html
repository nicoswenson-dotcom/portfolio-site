<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Nico Swenson</title>
  <link rel="icon" href="assets/images/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #111; }

    /* ══════════════════════════════════════
       FULL-SCREEN VIEWER
    ══════════════════════════════════════ */
    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.25s ease;
    }
    .viewer img.fade-out { opacity: 0; }

    /* ══════════════════════════════════════
       OVERLAID NAVIGATION
    ══════════════════════════════════════ */
    .nav-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: linear-gradient(to bottom, rgba(17,17,17,0.88) 0%, transparent 100%);
      pointer-events: none;
    }
    .nav-top > * { pointer-events: auto; }
    .nav-top__logo { height: 30px; opacity: 0.92; }
    .nav-top__counter {
      font-family: 'Oswald', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.55);
    }
    .nav-top__back {
      font-family: 'Oswald', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-top__back:hover { color: #ffd400; }

    /* Side arrows */
    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 200;
      background: rgba(255, 212, 0, 0.85);
      color: #111;
      border: none;
      width: 40px; height: 64px;
      font-size: 1.2rem; font-weight: 900;
      cursor: pointer;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.5);
      transition: background 0.15s, transform 0.15s, opacity 0.2s;
    }
    .arrow:hover { background: #fff; transform: translateY(-50%) scale(1.07); }
    .arrow:disabled { opacity: 0; pointer-events: none; }
    .arrow--prev { left: 8px; }
    .arrow--next { right: 8px; }

    /* Section nav */
    .page-nav {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      align-items: baseline;
      gap: 0;
      white-space: nowrap;
    }
    .sec-btn {
      background: none;
      border: none;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      padding: 4px 10px;
      line-height: 1;
      transition: color 0.15s;
      position: relative;
    }
    .sec-btn + .sec-btn::before {
      content: '·';
      position: absolute;
      left: 0;
      color: rgba(255,255,255,0.3);
      font-size: 0.7rem;
    }
    .sec-btn:hover { color: rgba(255,255,255,0.9); }
    .sec-btn.active { color: #ffd400; font-weight: 700; }

    /* TOC clickable overlays */
    .toc-overlay {
      position: fixed;
      z-index: 150;
      cursor: pointer;
      background: transparent;
      border: none;
      display: none;
    }
    .toc-overlay:hover { background: rgba(228,2,140,0.08); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

  <div class="viewer" id="viewer">
    <img id="imgMain" alt="" />
  </div>

  <div class="nav-top">
    <a class="nav-top__back" href="index.html">← Back</a>
    <img class="nav-top__logo" src="assets/images/logo.png" alt="Nico Swenson" />
    <span class="nav-top__counter" id="counter"></span>
  </div>

  <button class="arrow arrow--prev" id="prev">&#8592;</button>
  <button class="arrow arrow--next" id="next">&#8594;</button>

  <!-- TOC overlays — positions set by JS -->
  <button class="toc-overlay" data-sec="1" title="About Me"></button>
  <button class="toc-overlay" data-sec="2" title="Drag"></button>
  <button class="toc-overlay" data-sec="3" title="Writing"></button>
  <button class="toc-overlay" data-sec="4" title="Design"></button>

  <nav class="page-nav">
    <button class="sec-btn" data-sec="0">Contents</button>
    <button class="sec-btn" data-sec="1">About Me</button>
    <button class="sec-btn" data-sec="2">Drag</button>
    <button class="sec-btn" data-sec="3">Writing</button>
    <button class="sec-btn" data-sec="4">Design</button>
    <button class="sec-btn" data-sec="5">Thot Bubbles</button>
  </nav>

  <script>
    // ── Data ─────────────────────────────────────────────
    const PAGES = Array.from({length: 11}, (_, i) =>
      `assets/images/draft-pages/page-${String(i+1).padStart(2,'0')}.jpg`
    );

    // Page index → section index (adjust once section starts are confirmed)
    const PAGE_SECTION = [0, 1, 2, 3, 3, 4, 4, 5, 5, 5, 5];

    // Section index → first page index
    const SECTION_PAGE = [0, 1, 2, 3, 5, 7];

    // ── State ─────────────────────────────────────────────
    let curPage  = 0;
    let turning  = false;

    // ── DOM ───────────────────────────────────────────────
    const imgMain  = document.getElementById('imgMain');
    const prevBtn  = document.getElementById('prev');
    const nextBtn  = document.getElementById('next');
    const counter  = document.getElementById('counter');
    const secBtns     = document.querySelectorAll('.sec-btn');
    const tocOverlays = document.querySelectorAll('.toc-overlay');

    // ── Preload ───────────────────────────────────────────
    function preload(idx) {
      [idx - 1, idx + 1].forEach(i => {
        if (i >= 0 && i < PAGES.length) new Image().src = PAGES[i];
      });
    }

    // ── Navigate ──────────────────────────────────────────
    function goTo(targetPage) {
      if (turning || targetPage === curPage) return;
      if (targetPage < 0 || targetPage >= PAGES.length) return;
      turning = true;
      updateButtons(true);

      imgMain.classList.add('fade-out');
      setTimeout(() => {
        curPage = targetPage;
        imgMain.src = PAGES[curPage];
        imgMain.classList.remove('fade-out');
        turning = false;
        updateUI();
        preload(curPage);
      }, 250);
    }

    function goNext() { goTo(curPage + 1); }
    function goPrev() { goTo(curPage - 1); }

    function goToSection(secIdx) {
      goTo(SECTION_PAGE[secIdx]);
    }

    // ── UI ────────────────────────────────────────────────
    function updateButtons(disabled) {
      prevBtn.disabled = disabled || curPage === 0;
      nextBtn.disabled = disabled || curPage === PAGES.length - 1;
    }

    function updateUI() {
      counter.textContent = `${curPage + 1} / ${PAGES.length}`;
      updateButtons(false);
      secBtns.forEach((b, i) => b.classList.toggle('active', i === PAGE_SECTION[curPage]));

      if (curPage === 0) positionTocOverlays();
      else tocOverlays.forEach(o => o.style.display = 'none');
    }

    // ── TOC overlays ──────────────────────────────────────
    // page-01.jpg is landscape 2139×1540.
    // Positions to be fine-tuned once rendered — rough estimates for now.
    const TOC_ROWS = [
      { top: 0.36, bottom: 0.44 }, // About Me
      { top: 0.44, bottom: 0.52 }, // Drag
      { top: 0.52, bottom: 0.60 }, // Writing
      { top: 0.60, bottom: 0.68 }, // Design
    ];

    function positionTocOverlays() {
      const rect = imgMain.getBoundingClientRect();
      const nw = imgMain.naturalWidth  || 2139;
      const nh = imgMain.naturalHeight || 1540;
      const ratio = nw / nh;
      const slotRatio = window.innerWidth / window.innerHeight;

      let imgW, imgH, imgX, imgY;
      if (slotRatio > ratio) {
        imgH = window.innerHeight;
        imgW = imgH * ratio;
        imgX = (window.innerWidth - imgW) / 2;
        imgY = 0;
      } else {
        imgW = window.innerWidth;
        imgH = imgW / ratio;
        imgX = 0;
        imgY = (window.innerHeight - imgH) / 2;
      }

      tocOverlays.forEach((o, i) => {
        const row = TOC_ROWS[i];
        o.style.display  = 'block';
        o.style.left     = imgX + 'px';
        o.style.width    = imgW + 'px';
        o.style.top      = (imgY + row.top  * imgH) + 'px';
        o.style.height   = ((row.bottom - row.top) * imgH) + 'px';
      });
    }

    // ── Events ────────────────────────────────────────────
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    secBtns.forEach(b => b.addEventListener('click', () => goToSection(+b.dataset.sec)));
    tocOverlays.forEach(o => o.addEventListener('click', () => goToSection(+o.dataset.sec)));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goPrev();
      if (e.key === 'ArrowRight') goNext();
    });

    let tx = null;
    document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
    document.addEventListener('touchend', e => {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 45) dx < 0 ? goNext() : goPrev();
      tx = null;
    }, {passive:true});

    window.addEventListener('resize', () => {
      if (curPage === 0) positionTocOverlays();
    });

    // ── Init ──────────────────────────────────────────────
    imgMain.src = PAGES[0];
    updateUI();
    preload(0);
  </script>

</body>
</html>
